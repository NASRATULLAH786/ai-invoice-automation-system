<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Invoice Automation System</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      background: linear-gradient(135deg, #1d4ed8, #0f172a);
      color: white;
      padding: 35px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .header p {
      margin: 0;
      color: #dbeafe;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }

    .card h2 {
      margin-top: 0;
      font-size: 22px;
    }

    textarea {
      width: 100%;
      height: 230px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      margin-top: 14px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .secondary-btn {
      background: #0f172a;
    }

    .secondary-btn:hover {
      background: #111827;
    }

    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #f3f4f6;
      font-size: 14px;
      min-height: 45px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      background: #e0f2fe;
      color: #075985;
    }

    .result-item {
      padding: 12px;
      border-radius: 10px;
      background: #f9fafb;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
    }

    .result-item strong {
      display: block;
      color: #111827;
      margin-bottom: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-weight: bold;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>AI Invoice Automation System</h1>
      <p>Extract structured invoice data using AI-powered workflow automation.</p>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Invoice Input</h2>
        <textarea id="invoiceText" placeholder="Paste invoice text here...

Example:
Invoice Number: INV-1001
Company: ABC Technologies
Date: 2026-05-16
Total Amount: $450.00"></textarea>

        <button onclick="extractInvoice()">Extract Invoice</button>
        <div id="statusBox" class="status">Ready to process invoice text.</div>
      </div>

      <div class="card">
        <h2>Extracted Invoice Data</h2>
        <div id="resultBox" class="status">No invoice extracted yet.</div>
      </div>

      <div class="card full-width">
        <h2>Saved Invoices</h2>
        <button class="secondary-btn" onclick="loadInvoices()">Load Saved Invoices</button>
        <div id="invoiceList" class="status">Click the button to load saved invoices.</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://127.0.0.1:8080";

    async function extractInvoice() {
      const invoiceText = document.getElementById("invoiceText").value.trim();
      const statusBox = document.getElementById("statusBox");
      const resultBox = document.getElementById("resultBox");

      if (!invoiceText) {
        statusBox.className = "status error";
        statusBox.innerText = "Please paste invoice text before extracting.";
        return;
      }

      statusBox.className = "status loading";
      statusBox.innerText = "Processing invoice with AI extractor...";
      resultBox.className = "status loading";
      resultBox.innerText = "Waiting for extraction result...";

      try {
        const response = await fetch(`${API_BASE_URL}/extract-invoice`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            invoice_text: invoiceText,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Failed to extract invoice.");
        }

        statusBox.className = "status success";
        statusBox.innerText = data.message || "Invoice extracted successfully.";

        const invoice = data.invoice;

        resultBox.className = "status";
        resultBox.innerHTML = `
          <div class="result-item">
            <strong>Company Name</strong>
            ${invoice.company_name || "Not found"}
          </div>
          <div class="result-item">
            <strong>Invoice Number</strong>
            ${invoice.invoice_number || "Not found"}
          </div>
          <div class="result-item">
            <strong>Date</strong>
            ${invoice.date || "Not found"}
          </div>
          <div class="result-item">
            <strong>Total Amount</strong>
            ${invoice.total_amount || "Not found"}
          </div>
        `;

        loadInvoices();

      } catch (error) {
        statusBox.className = "status error";
        statusBox.innerText = error.message;

        resultBox.className = "status error";
        resultBox.innerText = "Extraction failed. Please check backend server and invoice text.";
      }
    }

    async function loadInvoices() {
      const invoiceList = document.getElementById("invoiceList");

      invoiceList.className = "status loading";
      invoiceList.innerText = "Loading saved invoices...";

      try {
        const response = await fetch(`${API_BASE_URL}/invoices`);
        const invoices = await response.json();

        if (!response.ok) {
          throw new Error("Failed to load saved invoices.");
        }

        if (!invoices.length) {
          invoiceList.className = "status";
          invoiceList.innerText = "No saved invoices found.";
          return;
        }

        invoiceList.className = "status";
        invoiceList.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Company</th>
                <th>Invoice #</th>
                <th>Date</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              ${invoices.map(invoice => `
                <tr>
                  <td>${invoice.id}</td>
                  <td>${invoice.company_name || "-"}</td>
                  <td>${invoice.invoice_number || "-"}</td>
                  <td>${invoice.date || "-"}</td>
                  <td>${invoice.total_amount || "-"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;

      } catch (error) {
        invoiceList.className = "status error";
        invoiceList.innerText = error.message;
      }
    }
  </script>
</body>
</html>
